# yaml-language-server: $schema=../../cs2demokit-rules.schema.json
# Paper-test reference answer — request #3 "Save rounds" (team lost, player survived).
ruleset: save_rounds
for: each_player
stats:
  saves:
    count: round_lost                    # the rounds this player's team lost
    while: player.survived
    per: match
show:
  scoreboard:
    - { stat: saves, label: Saves, group: game }
