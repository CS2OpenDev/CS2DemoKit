# yaml-language-server: $schema=../../dv-rules.schema.json
# Paper-test reference answer — request #3 "Save rounds" (team lost, player survived).
ruleset: save_rounds
for: each_player
stats:
  saves:
    count: round_won
    where: "enrich.round.has_winner && enrich.round.winner_team != player.team"
    while: player.survived
    per: match
show:
  scoreboard:
    - { stat: saves, label: Saves, group: game }
