# Publish the three CS2DemoKit packages from a v* tag.
#
# Channel: the maintainer's GitHub Packages feed. nuget.org is NOT yet reachable for this family —
# every package here depends on the CS2OpenDev family, which publishes to GitHub Packages only
# (CS2OpenDev-SDK#5, decided upstream), and a nuget.org package cannot depend on one that is not
# there. The nuget.org steps below are written and commented out (auth via a trusted-publishing
# policy, no stored key), ready for the day that changes.
name: nuget

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to the repo owner's GitHub Packages feed via the built-in token
  # id-token: write # uncomment together with the nuget.org trusted-publishing steps below

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools (nbgv)
        run: dotnet tool restore

      # A tag build must stamp a STABLE version. If publicReleaseRefSpec fails to match the ref,
      # NBGV stamps 0.9.0-g<sha> family-wide, which makes the exact [0.9.0] intra-family pins
      # unsatisfiable — a broken package set that still uploads happily. Fail here instead.
      - name: Assert a stable version stamp
        run: |
          set -euo pipefail
          version=$(dotnet nbgv get-version -p src/CS2DemoKit.Parser -v NuGetPackageVersion)
          public=$(dotnet nbgv get-version -p src/CS2DemoKit.Parser -v PublicRelease)
          echo "NuGetPackageVersion=$version PublicRelease=$public"
          if [ "$public" != "True" ]; then
            echo "::error::PublicRelease is $public — this ref does not match publicReleaseRefSpec in version.json." >&2
            exit 1
          fi
          case "$version" in
            *-g*) echo "::error::Version $version is a prerelease stamp; exact family pins would be unsatisfiable." >&2; exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME disagrees with the stamped version $version." >&2
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build CS2DemoKit.slnx -c Release
          dotnet run --project test/CS2DemoKit.Parser.Tests -c Release --no-build
          dotnet run --project test/CS2DemoKit.Analysis.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/CS2DemoKit.Parser -c Release -o artifacts/pack --no-build
          dotnet pack src/CS2DemoKit.Analysis -c Release -o artifacts/pack --no-build
          dotnet pack src/CS2DemoKit.Analysis.Rules -c Release -o artifacts/pack --no-build

      - name: Scan packed artifacts
        run: python3 scripts/scan-nuget-artifacts.py artifacts/pack

      # Last gate before upload: restore the exact nupkgs about to be published and run against
      # them. A package that cannot be consumed must not reach the feed.
      - name: Smoke-test the packages
        working-directory: scripts/nuget-smoke
        run: |
          version=$(dotnet nbgv get-version -p ../../src/CS2DemoKit.Parser -v NuGetPackageVersion)
          dotnet run -c Release -p:CS2DemoKitVersion="$version" -- ../../tests/assets/sample-de_nuke.dem

      - name: Upload packages as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/pack/

      # GitHub Packages rejects .snupkg, so symbols ship as the run artifact above rather than
      # alongside the package. --skip-duplicate keeps a re-run of the same tag idempotent.
      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "artifacts/pack/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate \
            --no-symbols

      # Enable once the CS2OpenDev family is on nuget.org (CS2OpenDev-SDK#5) — as of 2026-08 only
      # CS2OpenDev.Sdk is there, and at 1.0.1 against our 5.1.0 pin. Publishing before then
      # produces packages no consumer can restore.
      #
      # Auth is a nuget.org Trusted Publishing policy (owner sid2934, repo CS2OpenDev/CS2DemoKit,
      # workflow nuget.yml) — no NUGET_API_KEY secret to provision. To enable: uncomment the two
      # steps below AND `id-token: write` in the permissions block up top (the OIDC exchange
      # needs it).
      # - name: Log in to nuget.org (trusted publishing)
      #   id: nuget-login
      #   uses: NuGet/login@v1
      #   with:
      #     user: sid2934
      # - name: Push to nuget.org
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     dotnet nuget push "artifacts/pack/*.nupkg" \
      #       --source https://api.nuget.org/v3/index.json \
      #       --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
      #       --skip-duplicate
