# Publish the three CS2DemoKit packages from a v* tag.
#
# Channels: the repo owner's GitHub Packages feed, and nuget.org. The CS2OpenDev dependencies
# ship on nuget.org under the renumbered public line (2026-08) that Directory.Packages.props
# pins, so the published packages restore from nuget.org alone. nuget.org auth is a
# trusted-publishing policy (owner sid2934, repo CS2OpenDev/CS2DemoKit, workflow nuget.yml):
# the login step exchanges the workflow's OIDC token for a short-lived key — no stored secret.
name: nuget

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # push to the repo owner's GitHub Packages feed via the built-in token
  id-token: write   # OIDC exchange for the nuget.org trusted-publishing login below

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Nerdbank.GitVersioning needs full history

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools (nbgv)
        run: dotnet tool restore

      # A tag build must stamp exactly the version the tag names, with no dev suffix. If
      # publicReleaseRefSpec fails to match the ref, NBGV appends -g<sha> family-wide and the exact
      # intra-family pins name versions that were never published: a broken package set that still
      # uploads happily. Fail here instead.
      #
      # Prerelease tags (v0.9.2-beta0001) are a supported release path and reach this step with
      # PublicRelease=True, because version.json's v\d+\.\d+ pattern is not anchored at the end.
      # Anchoring it would silently turn every prerelease tag into a dev stamp. See docs/releasing.md.
      - name: Assert the stamp matches the tag
        run: |
          set -euo pipefail
          version=$(dotnet nbgv get-version -p src/CS2DemoKit.Parser -v NuGetPackageVersion)
          public=$(dotnet nbgv get-version -p src/CS2DemoKit.Parser -v PublicRelease)
          echo "NuGetPackageVersion=$version PublicRelease=$public"
          if [ "$public" != "True" ]; then
            echo "::error::PublicRelease is $public. This ref does not match publicReleaseRefSpec in version.json." >&2
            exit 1
          fi
          # NBGV's dev suffix is exactly -g plus ten lowercase hex characters, at the end. Matching
          # that shape rather than a bare -g keeps a real prerelease label out of the guard.
          case "$version" in
            *-g[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f])
              echo "::error::Version $version carries a dev stamp; exact family pins would be unsatisfiable." >&2
              exit 1 ;;
          esac
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME disagrees with the stamped version $version." >&2
            exit 1
          fi

      - name: Build and test
        run: |
          dotnet build CS2DemoKit.slnx -c Release
          dotnet run --project test/CS2DemoKit.Parser.Tests -c Release --no-build
          dotnet run --project test/CS2DemoKit.Analysis.Tests -c Release --no-build

      - name: Pack
        run: |
          dotnet pack src/CS2DemoKit.Parser -c Release -o artifacts/pack --no-build
          dotnet pack src/CS2DemoKit.Analysis -c Release -o artifacts/pack --no-build
          dotnet pack src/CS2DemoKit.Analysis.Rules -c Release -o artifacts/pack --no-build

      - name: Scan packed artifacts
        run: python3 scripts/scan-nuget-artifacts.py artifacts/pack

      # Last gate before upload: restore the exact nupkgs about to be published and run against
      # them. A package that cannot be consumed must not reach the feed.
      #
      # Version from the packed filename rather than a second nbgv call, so the consumer cannot
      # reference a version the pack did not produce. On a tag ref the two agree, but only because
      # the ref matches publicReleaseRefSpec; ci.yml has the same step where they do not.
      - name: Smoke-test the packages
        working-directory: scripts/nuget-smoke
        run: |
          set -euo pipefail
          shopt -s nullglob
          packed=(../../artifacts/pack/CS2DemoKit.Parser.*.nupkg)
          if [ ${#packed[@]} -ne 1 ]; then
            echo "::error::expected one packed CS2DemoKit.Parser nupkg, found ${#packed[@]}" >&2
            exit 1
          fi
          version=$(basename "${packed[0]}" .nupkg)
          version=${version#CS2DemoKit.Parser.}
          echo "smoke-testing CS2DemoKit $version"
          dotnet run -c Release -p:CS2DemoKitVersion="$version" -- ../../tests/assets/sample-de_nuke.dem

      - name: Upload packages as run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/pack/

      # GitHub Packages rejects .snupkg, so symbols ship as the run artifact above rather than
      # alongside the package. --skip-duplicate keeps a re-run of the same tag idempotent.
      - name: Push to GitHub Packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "artifacts/pack/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate \
            --no-symbols

      - name: Log in to nuget.org (trusted publishing)
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: sid2934

      - name: Push to nuget.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet nuget push "artifacts/pack/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
